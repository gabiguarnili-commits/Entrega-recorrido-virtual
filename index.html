<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Recorrido virtual SATC</title>
    <link rel="stylesheet" href="estilo.css">
</head>
<body>
    <section class="inicio">
        <h1 id="titulo">sex and the city</h1>
        <p class="pista">Toca el título</p>
    </section>

    <audio id="cancion" src="audio/cancion.mp3" loop></audio>

    <main>
        <img src="images/satc1.jpg" alt="Las cuatro protagonistas de Sex and the City" class="portada">

        <p class="descripcion">
            Sex and the City trata sobre cuatro amigas en Nueva York que intentan sobrevivir
            al amor, las citas, el trabajo y la vida adulta, mientras se cuentan absolutamente todo.
        </p>

        <section class="galeria">
            <div class="personajes">
                <a href="carrie.html" class="personaje">
                    <img src="images/carrie.jpg" alt="Carrie Bradshaw">
                    <span>Carrie</span>
                </a>
                <a href="miranda.html" class="personaje">
                    <img src="images/miranda.jpg" alt="Miranda Hobbes">
                    <span>Miranda</span>
                </a>
                <a href="charlotte.html" class="personaje">
                    <img src="images/charlotte.jpg" alt="Charlotte York">
                    <span>Charlotte</span>
                </a>
                <a href="samantha.html" class="personaje">
                    <img src="images/samantha.jpg" alt="Samantha Jones">
                    <span>Samantha</span>
                </a>
            </div>
        </section>
    </main>

    <script src="script.js"></script>
</body>
</html>
